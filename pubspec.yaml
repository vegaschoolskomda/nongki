name: nongki
description: "NONGKI - Temukan tempat nongkrong terbaik sesuai budgetmu"
publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1

  # Supabase (siap diaktifkan saat key tersedia)
  supabase_flutter: ^2.18.3

  # Local storage
  shared_preferences: ^2.5.3

  # UI Components
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.2.0+3

  # Location & Maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

  # CSV & Data
  csv: ^6.0.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/data/
